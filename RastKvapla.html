<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Rast kvapľa</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/rast-kvapla.css">

    <script src="js/main.js" defer></script>
    <script src="js/rast-kvapla.js" defer></script>
</head>

<body data-translation-page="mapa" style="background: url('img/hry/Pozadie.png'); background-size: cover; background-position: center;">

    <main class="rast-page">
        <h1 class="rast-title" data-txt="btnRastKvapla">Rast kvapľa</h1>

        <section class="rast-stage">
            <div class="rast-media-wrap">
                <img class="rast-media" id="rastMedia" src="img/hry/rast-kvapla/00.png" alt="Rast kvapľa">
                <div class="rast-fallback" data-txt="rastFallback">Sem vlož GIF alebo obrázky fáz rastu kvapľa.</div>
            </div>
            <input class="rast-slider" id="rastSlider" type="range" min="0" max="7" step="1" value="0" aria-label="Rast kvapľa">
        </section>

        <p class="rast-status" data-txt="rastInstruction">Posúvaj časovú os a sleduj, ako kvapeľ rastie v čase.</p>
    </main>

    <div class="global-control-buttons">
        <a class="home-button" href="mapa.html">
            <img class="home-button-img" src="img/home-button.svg" alt="Domov">
        </a>

        <a href="Hry.html" class="hry-btn" data-txt="btnGames">Hry</a>

        <a href="pexeso.html" class="hry-btn-hra" data-txt="btnPexeso">Pexeso</a>

        <a href="RastKvapla.html" class="hry-btn-picked" data-txt="btnRastKvapla">Rast kvapľa</a>

        <a href="VystrojJaskyniara.html" class="hry-btn-hra" data-txt="btnVystrojJaskyniara">
            Výstroj Jaskyniara
        </a>
    </div>

    <div class="map-lang-switches">
        <a href="#" class="map-lang-btn" data-lang-switch="svk">
            <img src="img/index/slovakia.jpg" alt="Slovak">
        </a>

        <a href="#" class="map-lang-btn" data-lang-switch="hun">
            <img src="img/index/hungary.png" alt="Hungarian">
        </a>

        <a href="#" class="map-lang-btn" data-lang-switch="eng">
            <img src="img/index/england.png" alt="English">
        </a>
    </div>

</body>
</html>
